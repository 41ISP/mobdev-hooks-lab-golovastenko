<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shelf — личный трекер чтения</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet" />
        <style>
            c
        </style>
    </head>
    <body>
        <div class="app">
            <div class="app-header">
                <div class="brand">
                    <div class="brand-mark">S</div>
                    <div class="brand-name">Shelf</div>
                </div>
            </div>

            <section class="screen active" id="screen-shelf">
                <p class="greeting">Добрый вечер</p>

                <div class="add-book-row">
                    <input
                        class="input"
                        id="bookInput"
                        placeholder="Название книги..." />
                    <button class="btn" id="addBtn">Добавить на полку</button>
                </div>

                <div class="list-toolbar">
                    <span class="toolbar-title">Книги</span>
                    <div class="filter-chip">
                        <input type="checkbox" id="filterCheckbox" />
                        <label for="filterCheckbox">
                            <span class="dot"></span>
                            Только непрочитанные
                        </label>
                    </div>
                </div>

                <div class="book-list" id="bookList">
                    <div class="book-row" data-id="1">
                        <div class="book-cover" style="background: #4f6b52">
                            К
                        </div>
                        <div class="book-info">
                            <p class="book-title done">Клара и Солнце</p>
                            <div class="book-author">Кадзуо Исигуро</div>
                        </div>
                        <div class="read-check checked" data-role="toggle">
                            <span class="check-circle">✓</span>
                            <span class="read-label">Прочитано</span>
                        </div>
                        <button
                            class="delete-btn"
                            data-role="delete"
                            title="Убрать с полки">
                            ✕
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
